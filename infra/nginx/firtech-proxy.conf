# /etc/nginx/snippets/firtech-proxy.conf: shared proxy settings for firtech.pro.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 60s;
# Supabase session cookies after a Google login are several KB: the default 4k response header
# buffer gave «upstream sent too big header» (502) on the cabinet callback (2026-11-21).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
