# /etc/nginx/snippets/firtech-proxy.conf: shared proxy settings for firtech.pro, every location (the Next
# site on :3001 and HQ's /agent/ and /media/ on :8787).
# Security 2026-11-23 (P1-2, P2-12): nothing sits in front of nginx, so the client address is $remote_addr.
# X-Forwarded-For is SET to it (no $proxy_add_x_forwarded_for: that appended a client-sent header, and HQ
# reads the first element, so anyone could pick their IP for HQ's limits), and X-Forwarded-Host is always
# $host (a client-sent X-Forwarded-Host never reaches the apps).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 60s;
# Supabase session cookies after a Google login are several KB: the default 4k response header
# buffer gave «upstream sent too big header» (502) on the cabinet callback (2026-11-21).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
