# /etc/nginx/sites-available/firtech.conf (symlinked into sites-enabled). Certbot adds the 443
# server and the http -> https redirect to this file (`certbot --nginx -d firtech.pro -d www.firtech.pro`).
# Vibely's server blocks are separate files and are not touched.
# On the server, Certbot's 443 block also needs `http2 on;` next to its `listen 443 ssl` lines.

# Rate limits per client IP (security 2026-11-23, P2-15; the apps keep their own limits too):
#   firtech_api    10 r/min  /api/lead, /api/audit (crawls a site), /agent/ (HQ public chat)
#   firtech_login  10 r/min  /api/admin/login (the app adds 5 free tries, then 1/min, 10/h per IP or IPv6 /64)
#   firtech_chat   30 r/min  /api/chat, /api/demo-agent/* (LLM calls; the app caps chat at 30/h per IP)
#   firtech_csp   300 r/min  /api/csp-report (Report-Only CSP; the app counts 200/min per IP)
#   firtech_admin 600 r/min  the rest of /api/admin/ (the panel polls every 10 s; handlers check the session)
# Over the limit nginx answers 429. Apply on the server: docs/security-2026-11-23.md («nginx»).
limit_req_zone $binary_remote_addr zone=firtech_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=firtech_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=firtech_chat:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=firtech_csp:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=firtech_admin:10m rate=600r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name www.firtech.pro;
    return 301 https://firtech.pro$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name firtech.pro;

    client_max_body_size 1m;
    # Incoming Cookie header can be big (Supabase session chunks, PKCE verifiers).
    large_client_header_buffers 4 32k;
    server_tokens off;

    # No gzip here: the Next server already compresses scripts and styles (checked 2026-10-18).

    # Hashed build files never change. Next already sends the long Cache-Control for them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    location = /api/lead {
        limit_req zone=firtech_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # Owner login: 10 a minute per IP (exact match wins over the /api/admin/ prefix below).
    location = /api/admin/login {
        limit_req zone=firtech_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # Free audit: HQ crawls the visitor's site, so few per IP.
    location = /api/audit {
        limit_req zone=firtech_api burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # On-page chat and the demo agents: each message is an LLM call.
    location = /api/chat {
        limit_req zone=firtech_chat burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }
    location ^~ /api/demo-agent/ {
        limit_req zone=firtech_chat burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # CSP violation reports (Report-Only): small bodies, many at once from one page view.
    location = /api/csp-report {
        limit_req zone=firtech_csp burst=50 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # Admin actions and the panel's polling: its own, much wider per-IP limit.
    location ^~ /api/admin/ {
        limit_req zone=firtech_admin burst=100 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # Cabinet uploads (materials, message attachments): up to 10 MB plus the form. Everything else keeps 1m.
    location = /api/cabinet/uploads {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # Public agent chat of HQ (`POST /agent/<publicId>/chat`): the demo page /<locale>/demo/<publicId>?k= and the clients'
    # own widgets call it on this host. HQ's webhook port, same as /media/ (agents docs/admin-crm-api.md). Added 2026-11-23:
    # needs a copy of this file on the server and `nginx -s reload` (the owner does it).
    # The snippet sets X-Forwarded-For $remote_addr and X-Forwarded-Host $host (security 2026-11-23, P1-2).
    location ^~ /agent/ {
        limit_req zone=firtech_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }

    # HQ's signed files (`/media/<sig>/<path>?e=`) are served on HQ's public host (IG_PUBLIC_BASE), not by
    # this file. Wherever the server proxies /media/ (check: `grep -rn media /etc/nginx/sites-enabled`), that
    # block must include /etc/nginx/snippets/firtech-proxy.conf too, so HQ sees $remote_addr, e.g.:
    #   location ^~ /media/ { proxy_pass http://127.0.0.1:8787; include /etc/nginx/snippets/firtech-proxy.conf; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/firtech-proxy.conf;
    }
}
