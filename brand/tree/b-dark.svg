<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#1d3a2a"/><stop offset="1" stop-color="#0a0d0b"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f7a0"/><stop offset="1" stop-color="#9fd657"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#glow)"/>
  <!-- Bottom tier first; each tier above gets a dark outline so the three tiers stay readable. -->
